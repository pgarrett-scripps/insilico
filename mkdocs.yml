site_name: In Silico
site_description: An open, AI-refereed overlay journal. Any field; the whole review published.
site_url: https://pgarrett-scripps.github.io/insilico/
repo_url: https://github.com/pgarrett-scripps/insilico
repo_name: insilico
edit_uri: ""

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  font:
    # Chrome and UI only. The serif that carries the journal's character is
    # loaded in extra.css and applied to headings and article prose, so the
    # navigation stays quiet and the reading column does the talking.
    text: Inter
    code: JetBrains Mono
  # `custom` defers the whole palette to CSS variables in extra.css, where
  # light and dark can share one set of semantic names.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  # Listing any plugin disables the implicit default, so search has to be
  # named explicitly or the site ships without it.
  - search
  # Generates an OG/Twitter card image per page from its title and
  # description. Without this a review posted to Bluesky or Mastodon renders
  # as a bare URL, which for a journal whose growth depends on people sharing
  # individual reviews is the difference between a link and an article.
  #
  # Needs the imaging extra (`mkdocs-material[imaging]`) plus system Cairo;
  # the publish workflow installs both. Disabled automatically when the site
  # is built without them rather than failing the build.
  - social:
      # Escape hatch for a machine without system Cairo: `SOCIAL_CARDS=false
      # mkdocs serve` builds everything else. Defaults on, so CI and the
      # published site always render cards rather than silently skipping them.
      enabled: !ENV [SOCIAL_CARDS, true]
      cards_layout_options:
        background_color: "#16202b"
        color: "#fdfcfa"

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/reviews.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  # The masthead and the review cards are hand-written HTML; md_in_html lets
  # markdown keep working inside those blocks instead of forcing every landing
  # page into raw HTML.
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Submit: submit.md
  - Criteria: criteria.md
  - Policy: policy.md
  - Reviews: reviews/index.md

# Individual review bundles are reachable from reviews/index.md and from each
# bundle's landing page; listing every specialist report in the nav would bury
# everything else.
not_in_nav: |
  reviews/*/**
