# PeerReviewAgents configuration for published In Silico reviews.
#
# The pipeline reads this automatically when run from the repo root, so the
# GitHub Action passes no model flags — anything on the command line would
# override this file and silently flatten the per-agent split below.
#
# For local development, override per-run instead of editing this file:
#
#   python scripts/run_review.py --url ... \
#     --provider openrouter --model minimax/minimax-m3 --debate-rounds 1
#
# That routes iteration through a ~$0.20/run model on a personal key rather
# than spending the lab's Anthropic budget on prompt tuning.
#
# LAYOUT IS LOAD-BEARING: every bare `key = value` below must stay above the
# first [table] header. In TOML a table header captures every key that follows
# it, so a top-level setting written after [agent_models] silently becomes
# `agent_models.<key>` — it parses, it validates, and it does nothing. That is
# exactly how the desk gate was mistakenly disabled once already. Add new
# scalar settings to the top half of this file, never the bottom.

# ---------------------------------------------------------------------------
# Provider and defaults
# ---------------------------------------------------------------------------

# Anthropic direct rather than through OpenRouter: it's the path the lab key
# pays for, and the only one where the manuscript prompt-cache applies — the
# pipeline threads the manuscript as a cached prefix through every stage that
# supports it.
provider = "anthropic"

# Fallback for any agent whose tag isn't defined below.
reasoning_model = "claude-sonnet-5"

# Two rounds. Round 2 re-sends the whole of round 1 as context, so it is the
# more expensive of the pair — expect roughly 30 to 50 cents on top of a run
# that costs about $1.75 with one round.
#
# It was set to 1 on the reasoning that the second round restated positions
# rather than moving them. That is worth paying for anyway: the panel's
# standing problem is that it does not press hard enough on whether a stated
# conclusion is actually earned, and one round gives the skeptic a single
# unanswered swing. A second lets the advocate answer and the skeptic decide
# whether the answer held, which is the part that resembles what a referee
# does. Drop back to 1 if cost bites.
debate_rounds = 2

# ---------------------------------------------------------------------------
# Review posture
# ---------------------------------------------------------------------------

# Review against In Silico's own criteria. In Silico *is* the venue, so it
# states its own standards rather than borrowing the pipeline's `general`
# profile, which stands in for an unspecified journal we would be guessing at.
#
# The profile lives in ./journals/insilico.toml, which is version-controlled
# next to the reviews it produced: anyone reading a review can check out the
# commit it names and see exactly what the panel was told to weigh.
#
# An editor can still override per submission for a paper explicitly targeting
# a named venue — the pipeline ships ~38 profiles — but the default is ours.
journals_dir = "journals"
target_journal = "insilico"

# ---------------------------------------------------------------------------
# The desk — before any reviewer is assigned
# ---------------------------------------------------------------------------

# Editorial triage — a single fast pass that desk-rejects work plainly
#    below the bar before spending the full panel on it.
#
#    On even though a human editor already ran `/review`, because those are
#    two different decisions: the editor decides whether a submission is worth
#    *considering*, the desk screen decides whether it clears the bar for full
#    review.
#
#    It is also close to free, and may be cheaper than not running it. The
#    screen deliberately shares the reviewers' model and manuscript prefix, so
#    its call warms the prompt cache that all 8 specialists then read on their
#    parallel fan-out — which would otherwise race and largely miss. And a
#    desk reject short-circuits the run before 18 further calls (8 reviewers,
#    2 auditors, two debate rounds of 2, area chair, rebuttal, editor, scout).
#
#    "gate" enforces the verdict; "warm" runs it for the cache but ignores the
#    verdict; "off" skips the call. The upstream prompt is explicitly
#    reject-sparingly and errs toward sending borderline work to the panel.
desk_screen_mode = "gate"

# ---------------------------------------------------------------------------
# Per-agent models  — TABLES ONLY BELOW THIS LINE
# ---------------------------------------------------------------------------
#
# Agents resolve a model through a named tag: reviewers -> "reviewer",
# debate -> "debate", auditors -> "audit", and editor / meta-reviewer /
# rebuttal / journal-scout -> "synthesis". The desk screen deliberately uses
# the *reviewer* tag rather than a tag of its own, so that the prompt cache it
# warms is the one the panel then reads — caches are per-model. There is no
# "screen" tag; a [models.screen] block here would be silently inert.
#
# This is the main cost lever. The 8 specialists and the 2 auditors are the
# widest fan-out and the most checklist-like, so they run on Haiku. The debate
# is adversarial reasoning rather than assessment, so it gets Sonnet. The area
# chair and editor decide the verdict, so they get Opus.

[models.reviewer]
model = "claude-haiku-4-5"

[models.audit]
model = "claude-haiku-4-5"

[models.debate]
model = "claude-sonnet-5"

[models.synthesis]
model = "claude-opus-5"

# `effort` controls adaptive thinking, and thinking tokens are billed at
# OUTPUT rates and then discarded — they never appear in a report. Measured on
# one paper: 74% of the output tokens billed produced no text in any file.
#
# It is now settable here and wins over the pipeline's call-site default (it
# used to be the other way round, which made this key silently inert). Only
# the area chair and the editor still think by default; the rebuttal and the
# scout had it removed upstream because neither decides anything.

# ---------------------------------------------------------------------------
# Per-agent overrides
# ---------------------------------------------------------------------------
#
# The `synthesis` tag covers four agents, and exactly one of them decides
# anything: the editor, which sees the panel, the debate, the meta-review, the
# audits and the rebuttal, and issues the verdict. It is the only agent left on
# Opus, and the only one that still thinks.
#
#   meta_reviewer        synthesises ten reports into one assessment. Real
#                        work, but the editor re-reads everything it saw, so
#                        deliberating at both stages pays for the same
#                        judgement twice.
#   author_rebuttal      argues the authors' side for the editor to weigh. It
#                        informs the verdict but does not set it.
#   journal_recommender  suggests venues to submit to. A courtesy, not a
#                        judgment, and nothing downstream reads it.
#
# One Opus call per review instead of four.

[agent_models]
# The area chair synthesises ten reports into one assessment; the editor then
# reads that assessment, plus the panel, the debate, the audits and the
# rebuttal, and issues the verdict. Only one of those two decides anything,
# and the editor re-reads everything the area chair saw — so paying Opus with
# thinking at both stages buys the same deliberation twice, at the most
# expensive rate in the run. The area chair drops to Sonnet without thinking.
meta_reviewer = { model = "claude-sonnet-5" }

author_rebuttal = { model = "claude-sonnet-5" }
journal_recommender = { model = "claude-haiku-4-5" }

# Two reviewers off the Haiku tag and onto Opus.
#
# READ THE CAVEAT AT THE BOTTOM OF THIS BLOCK BEFORE TRUSTING IT.
#
# Benchmarking this panel against Nature's published referee reports for one
# paper (runs/benchmark-609665v2) attributed every human-matching finding to
# the node that originated it. Four of the eight specialists produce nearly
# all of the overlap, and on that run the gap between an all-Haiku panel and
# an all-Opus panel sat almost entirely in these two:
#
#   data_analysis  On Opus it originated six of the referees' points, including
#                  both of the chemistry explanations that were the referees'
#                  strongest attack on the paper — that the manuscript's
#                  headline sequence motifs are sample-preparation artefacts.
#                  On Haiku, DeepSeek and a free model, the same node named the
#                  same motifs and only asked whether they were defined post
#                  hoc. Same prompt, same manuscript, different depth.
#   rigor          Produced the single sharpest finding in the benchmark: the
#                  "KRAQ motif" is more parsimoniously a ragged-cleavage
#                  artefact, and the manuscript's own enrichment data say so.
#
# The other six specialists stay on Haiku, where the benchmark found no
# separation between Haiku, a $0.10 model and a free one.
#
# Measured cost: $3.38 per review, against $9.28 to put the whole panel on
# Opus and about $3.00 for the all-Haiku panel.
#
# THE CAVEAT. The first run of this configuration did not reproduce either
# finding described above. Its Opus data_analysis reviewer wrote a competent
# review about causal inference and multiple testing and never raised the
# measurement artefact at all; its Opus rigor reviewer found a minor filtering
# point instead of the ragged-cleavage argument, and abstained from scoring.
# Same model, same prompt, same manuscript, same profile as the run that
# produced both — and reviewers run in parallel and never read each other, so
# sampling randomness is the only variable that differed.
#
# What that means: a single review is one sample of a high-variance process,
# and the all-Opus run that motivated this change was one sample too. This
# setting is a reasonable bet, not a demonstrated improvement. Do not quote
# the benchmark as evidence that it works until it has been run over several
# papers — and note that the same variance makes the *prompt* lever more
# attractive than the model lever, since an instruction that makes the
# artefact question mandatory does not depend on a model choosing to ask it.
data_analysis = { model = "claude-opus-5" }
rigor = { model = "claude-opus-5" }
