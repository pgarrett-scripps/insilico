# PeerReviewAgents configuration for published In Silico reviews.
#
# The pipeline reads this automatically when run from the repo root, so the
# GitHub Action passes no model flags — anything on the command line would
# override this file and silently flatten the per-agent split below.
#
# For local development, override per-run instead of editing this file:
#
#   python scripts/run_review.py --url ... \
#     --provider openrouter --model minimax/minimax-m3 --debate-rounds 1
#
# That routes iteration through a ~$0.20/run model on a personal key rather
# than spending the lab's Anthropic budget on prompt tuning.
#
# LAYOUT IS LOAD-BEARING: every bare `key = value` below must stay above the
# first [table] header. In TOML a table header captures every key that follows
# it, so a top-level setting written after [agent_models] silently becomes
# `agent_models.<key>` — it parses, it validates, and it does nothing. That is
# exactly how the desk gate was mistakenly disabled once already. Add new
# scalar settings to the top half of this file, never the bottom.

# ---------------------------------------------------------------------------
# Provider and defaults
# ---------------------------------------------------------------------------

# Anthropic direct rather than through OpenRouter: it's the path the lab key
# pays for, and the only one where the manuscript prompt-cache applies — the
# pipeline threads the manuscript as a cached prefix through every stage that
# supports it.
provider = "anthropic"

# Fallback for any agent whose tag isn't defined below.
reasoning_model = "claude-sonnet-5"

# Five complementary reviewers cover scientific validity, quantitative
# evidence, contribution and prior work, reporting and reproducibility, and
# ethics — since PeerReviewAgents 0.5.0 that panel is the only one, and the
# old review_workflow / reviewer_panel keys are gone. The advocate and
# skeptic argue in PARALLEL each round, and a Sonnet synthesizer condenses
# the finished debate into the one account the editor reads beside the full
# reports; the raw transcript is still published.
enable_debate = true

# Two rounds. Round 1 is two independent cases built blind from the panel —
# neither debater sees the other — and round 2 is the rebuttal exchange after
# each reads the full round-1 record. Rounds are parallel, so two rounds cost
# two serial steps, the same wall-clock depth the old sequential single round
# had.
debate_rounds = 2

# Venue suggestions are useful to In Silico readers but do not affect the
# verdict. They remain enabled here and run on Haiku below.
enable_journal_recommender = true

# ---------------------------------------------------------------------------
# Review posture
# ---------------------------------------------------------------------------

# Review against In Silico's own criteria. In Silico *is* the venue, so it
# states its own standards rather than borrowing the pipeline's `general`
# profile, which stands in for an unspecified journal we would be guessing at.
#
# The profile lives in ./journals/insilico.toml, which is version-controlled
# next to the reviews it produced: anyone reading a review can check out the
# commit it names and see exactly what the panel was told to weigh.
#
# An editor can still override per submission for a paper explicitly targeting
# a named venue — the pipeline ships ~38 profiles — but the default is ours.
journals_dir = "journals"
target_journal = "insilico"

# ---------------------------------------------------------------------------
# The desk — before any reviewer is assigned
# ---------------------------------------------------------------------------

# Editorial triage — a single fast pass that desk-rejects work plainly
#    below the bar before spending the full panel on it.
#
#    On even though a human editor already ran `/review`, because those are
#    two different decisions: the editor decides whether a submission is worth
#    *considering*, the desk screen decides whether it clears the bar for full
#    review.
#
#    It is also close to free, and may be cheaper than not running it. The
#    screen deliberately shares the reviewers' model and manuscript prefix, so
#    its call warms the prompt cache that all 5 specialists then read on their
#    parallel fan-out — which would otherwise race and largely miss. And a
#    desk reject short-circuits the run before 14 further calls (5 reviewers,
#    2 auditors, two parallel debate rounds of 2, synthesizer, editor, scout).
#
#    "gate" enforces the verdict; "warm" runs it for the cache but ignores the
#    verdict; "off" skips the call. The upstream prompt is explicitly
#    reject-sparingly and errs toward sending borderline work to the panel.
desk_screen_mode = "gate"
# A degraded conversion still carries readable manuscript text. Continue with
# a disclosed warning and withhold section-keyed statistics. Only stop when
# the conversion is broken enough that the panel would review damaged text.
conversion_gate = "broken"

# ---------------------------------------------------------------------------
# Per-agent models  — TABLES ONLY BELOW THIS LINE
# ---------------------------------------------------------------------------
#
# Agents resolve a model through a named tag: reviewers -> "reviewer",
# debate -> "debate", auditors -> "audit", and debate synthesizer / editor /
# journal-scout -> "synthesis". The desk screen deliberately uses
# the *reviewer* tag rather than a tag of its own, so that the prompt cache it
# warms is the one the panel then reads — caches are per-model. There is no
# "screen" tag; a [models.screen] block here would be silently inert.
#
# This is the main cost lever. The 5 specialists and the 2 auditors are the
# widest fan-out and the most checklist-like, so they run on Haiku. The debate
# is adversarial reasoning rather than assessment, so it gets Sonnet. The
# editor alone gets Opus.

[models.reviewer]
model = "claude-haiku-4-5"

[models.audit]
model = "claude-haiku-4-5"

[models.debate]
model = "claude-sonnet-5"

[models.synthesis]
model = "claude-opus-5"

# `effort` controls adaptive thinking, and thinking tokens are billed at
# OUTPUT rates and then discarded — they never appear in a report. Measured on
# one paper: 74% of the output tokens billed produced no text in any file.
#
# It is now settable here and wins over the pipeline's call-site default (it
# used to be the other way round, which made this key silently inert). The
# editor is the only decision stage. The venue scout does not decide.

# ---------------------------------------------------------------------------
# Per-agent overrides
# ---------------------------------------------------------------------------
#
# The `synthesis` tag covers the debate synthesizer, editor, and journal
# scout. The editor sees the manuscript, complete panel, audits, and the
# debate synthesis, and issues the verdict; the raw debate transcript is
# published but deliberately not part of the editor's record. Nothing
# downstream reads the venue suggestions.
#
# One Opus call per review instead of three.

[agent_models]
# The synthesizer condenses the finished debate for the editor but does not
# decide the verdict, so it runs on Sonnet.
debate_synthesizer = { model = "claude-sonnet-5" }

# Venue selection is useful but non-decisional, so keep it on the cheap model.
journal_recommender = { model = "claude-haiku-4-5" }
