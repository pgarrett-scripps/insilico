name: CI

# Review PRs are machine-generated, so the site build has to be checked *before*
# merge. A bundle the site cannot render would otherwise take down the deploy
# only once it had already landed on main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle rendering is well-formed
        run: python scripts/smoke_test.py

      - name: Published artifact manifests are valid
        run: python scripts/check_review_manifests.py

  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Published review provenance matches its schema
        run: npm run check:schema

      - name: Generated Markdown is inert
        run: npm run check:markdown

      - name: Review attempts preserve their editorial baseline
        run: npm run check:attempts

      - name: Site builds
        run: npm run build

      - name: Project prose contains no forbidden punctuation
        run: npm run check:punctuation

      # Astro will happily build a site with zero review pages if the corpus
      # reader stops matching the layout the pipeline writes. This is exactly
      # the silent failure that has bitten this repo before. Assert the corpus
      # actually made it into the output.
      - name: Every published review rendered
        run: |
          expected=$(find docs/reviews -name provenance.json | wc -l)
          actual=0
          while IFS= read -r provenance
          do
            route=${provenance#docs/reviews/}
            route=${route%/provenance.json}
            if [ -f "dist/reviews/${route}/index.html" ]
            then
              actual=$((actual + 1))
            else
              echo "::error::No review page was built for ${route}."
            fi
          done < <(find docs/reviews -name provenance.json -print)
          echo "bundles on disk: $expected, review pages built: $actual"
          if [ "$expected" -ne "$actual" ]
          then
            exit 1
          fi
          if [ "$expected" -eq 0 ]; then
            echo "::warning::No review bundles found. Nothing to check."
          fi

      # The editorial pages link to each other as `policy.md#anchor` so they
      # read correctly on GitHub. A remark plugin rewrites those into site URLs
      # at build time. When that plugin stops matching a link, the page still
      # builds and the link still looks right in the source. It just 404s for
      # every reader. Seven of them shipped that way once.
      - name: No unrewritten internal .md links escaped into the build
        run: |
          bad_links="$(
            grep -rhoE 'href="[^"]*\.md[^"]*"' dist/ \
              | grep -vE '^href="https?://' \
              | sort -u \
              || true
          )"
          if [ -n "$bad_links" ]
          then
            echo "::error::These links point at .md files and will 404:"
            echo "$bad_links"
            exit 1
          fi
          echo "no internal .md hrefs in the built site"
