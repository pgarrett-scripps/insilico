name: CI

# Review PRs are machine-generated, so the site build has to be checked *before*
# merge — a bundle the site can't render would otherwise take down the deploy
# only once it had already landed on main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bundle rendering is well-formed
        run: python scripts/smoke_test.py

  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Site builds
        run: npm run build

      # Astro will happily build a site with zero review pages if the corpus
      # reader stops matching the layout the pipeline writes — which is exactly
      # the silent failure that has bitten this repo before. Assert the corpus
      # actually made it into the output.
      - name: Every published review rendered
        run: |
          # <year>/<slug>/v<N>/provenance.json and <year>/<slug>/v<N>/index.html
          # are both four levels below their respective reviews/ root.
          expected=$(find docs/reviews -mindepth 4 -maxdepth 4 -name provenance.json | wc -l)
          actual=$(find dist/reviews -mindepth 4 -maxdepth 4 -path '*/v*/index.html' | wc -l)
          echo "bundles on disk: $expected · review pages built: $actual"
          if [ "$expected" -ne "$actual" ]; then
            echo "::error::$expected review bundles exist but $actual pages were built."
            exit 1
          fi
          if [ "$expected" -eq 0 ]; then
            echo "::warning::No review bundles found — nothing to check."
          fi
