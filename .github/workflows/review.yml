name: Run referee panel (retired)

# This workflow used to run the whole referee panel on a GitHub runner against a
# paid API key. It no longer does anything, and it no longer reads a secret.
#
# A review is now generated on the editor's own machine, on a Claude Code
# subscription, and uploaded as a pull request. Merging that pull request is
# still what publishes the review. The route is the `local-review` project
# skill, and docs/development.md describes it.
#
# Kept as a stub rather than removed so that an editor who types `/review` on a
# submission issue, or who opens the Actions tab looking for the old button,
# finds a pointer instead of silence. It is manual-only and fails immediately.
# Once nobody is looking for it any more, delete the file.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Point at the local generator and stop
        run: |
          echo "::error::The hosted referee panel is retired. Reviews are now"\
               "generated locally on a Claude Code subscription and uploaded as"\
               "a pull request. Run the 'local-review' skill in Claude Code from"\
               "a checkout of this repository, then open a PR with the bundle it"\
               "writes under docs/reviews. See docs/development.md."
          exit 1
