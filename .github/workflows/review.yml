name: Run referee panel

# Triggered by an editor commenting `/review` on a submission issue, or manually
# with a URL. Deliberately *not* automatic: each run costs real money, and a
# `pull_request` trigger from a fork could not see the API key anyway.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      url:
        description: Preprint URL (arXiv / bioRxiv / medRxiv)
        required: true
      submission_id:
        description: Submission issue number (optional)
        required: false
      command:
        description: "Review command (e.g. /review replace); blank means /review"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: review-${{ github.event.issue.number || github.event.inputs.url }}
  cancel-in-progress: false

env:
  # Model selection lives in ./peerreview.toml, including the per-role split.
  # Setting REVIEW_MODEL here would override that file and collapse every
  # stage back onto one model, so it is deliberately unset.
  # PyPI release versions are immutable. Updating the panel therefore takes a
  # reviewed change to this file instead of silently following upstream main.
  PIPELINE_VERSION: "0.5.1"
  # PDF converter used when official full text is unavailable. It is pinned so
  # fallback behavior cannot change silently between rounds.
  RUSTYPAPER_SPEC: "rustypaper==0.2.0"
  # The text as written. Compression was measured and reverted: under `light`
  # the clarity reviewer reported "grammatical errors that obscure the main
  # claims" three times on a paper where the uncompressed run reported none —
  # it read the dropped articles and copulas as the authors' writing. The
  # manuscript is a cached prefix on the cheapest model tier, so compressing
  # it saves under a cent a review, which does not buy a published criticism
  # of real people for something we did to their text.
  PEERREVIEW_CAVEMAN: "off"

jobs:
  review:
    # Editors only. author_association is computed by GitHub from repo
    # permissions, so this cannot be spoofed by the comment body.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
       (github.event.comment.body == '/review' ||
        startsWith(github.event.comment.body, '/review ') ||
        github.event.comment.body == '/revise' ||
        startsWith(github.event.comment.body, '/revise ')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Acknowledge the command
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OCR fallback
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils tesseract-ocr

      - name: Install the pinned referee panel
        run: |
          # [research] pulls the arXiv client. Without it the contribution
          # referee's arXiv vendor degrades to a one-line "arxiv
          # unavailable" note and the router silently falls through to the
          # other sources — so the panel would still produce confident claims
          # about prior work, just without having searched the index that
          # matters most for the computational half of the corpus. It fails
          # quietly by design, which is exactly why it has to be installed
          # explicitly rather than assumed.
          pip install --quiet "peerreviewagents[research]==${PIPELINE_VERSION}"
          pip install --quiet pyyaml

          installed="$(python -c 'from importlib.metadata import version; print(version("peerreviewagents"))')"
          if [ "$installed" != "$PIPELINE_VERSION" ]; then
            echo "::error::Expected PeerReviewAgents $PIPELINE_VERSION, got $installed."
            exit 1
          fi

          # peerreviewagents depends on rustypaper. This explicit install pins
          # the PDF fallback version and gives installation failures a clear
          # message.
          pip install --quiet "$RUSTYPAPER_SPEC" || {
            echo "::error::rustypaper did not install, so there is no way to"\
                 "read the manuscript. Nothing is published from this run."
            exit 1
          }

          # Confirm the optional vendor actually landed, rather than
          # discovering months later that every review skipped arXiv.
          python -c "import arxiv" || {
            echo "::error::peerreviewagents[research] did not install the arxiv"\
                 "client. The contribution referee would silently skip"\
                 "arXiv, so this run is stopping instead of publishing a review"\
                 "that claims to have searched it."
            exit 1
          }

      # A failed run's paid work survives it. The pipeline writes an atomic
      # checkpoint per successful agent under runs/.checkpoints, keyed by
      # manuscript content + semantic config, and resumes from them on a
      # re-run — so `/review` after a mid-panel failure pays only for the
      # agents that never finished, not the whole panel again. The runner
      # opts in (see run_review.py); this step is what makes it matter on a
      # runner whose workspace starts empty. Restoring a checkpoint that does
      # not match — another paper, a new draft, changed models — is inert by
      # construction, and `/review replace` restores but deliberately ignores
      # them: the runner passes resume=False so a new attempt samples fresh
      # instead of replaying the prior attempt.
      - name: Restore panel checkpoints
        uses: actions/cache/restore@v4
        with:
          path: runs/.checkpoints
          key: pra-checkpoints-${{ github.event.issue.number || github.event.inputs.submission_id || 'manual' }}-${{ github.run_id }}
          restore-keys: |
            pra-checkpoints-${{ github.event.issue.number || github.event.inputs.submission_id || 'manual' }}-

      - name: Run the panel
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only used when an editor writes `/review openrouter <model>`.
          # Absent, that command fails with an authentication error rather
          # than silently falling back to a paid Anthropic run.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Untrusted input reaches the script through the environment, never
          # through shell interpolation.
          ISSUE_BODY: ${{ github.event.issue.body }}
          # On a dispatch there is no comment; the optional `command` input
          # stands in so a queued run can say `/review replace`.
          COMMENT_BODY: ${{ github.event.comment.body || github.event.inputs.command }}
          INPUT_URL: ${{ github.event.inputs.url }}
          SUBMISSION_ID: ${{ github.event.issue.number || github.event.inputs.submission_id }}
          SUBMITTER: ${{ github.event.issue.user.login }}
        run: |
          # One verb. Whether this is a first look or a new round is read off
          # which draft the archive serves — a draft we have not reviewed is a
          # new round — rather than declared by the editor. `/revise` still
          # works and does exactly what `/review` does.
          #
          # --publish is passed here and nowhere else. This is the editorial
          # route: an editor typed a command on a submission issue, so the
          # result belongs in docs/reviews/. A local run testing a prompt
          # change is a question about the pipeline and lands in runs/.
          #
          # Neither form accepts author text. The panel judges the manuscript
          # in front of it; an author's account of what they changed is not
          # evidence, and when it was accepted the compliance auditor
          # confirmed claims the manuscript did not support.
          #
          # The comment is passed through, never interpreted here. `replace`
          # and the provider options are parsed in Python (see parse_command),
          # which is the one place this untrusted text is read and which
          # refuses anything that is not a known constant or a validated model
          # slug. Bash only ever handles it as an environment variable.
          #
          # Exit 3 is not a failure. It means no available text source passed
          # validation and the panel was never started. That is a technical
          # result, so it gets a plain note rather than a published verdict.
          # Exit 2 is a command nobody could act on; exit 4 is a draft already
          # reviewed. Same treatment: say so, do not fail the run.
          set +e
          if [ -n "$INPUT_URL" ]; then
            python scripts/run_review.py \
              --command "$COMMENT_BODY" \
              --publish \
              --url "$INPUT_URL" \
              --submission-id "${SUBMISSION_ID:-}" \
              --submitter "${SUBMITTER:-}"
          else
            python scripts/run_review.py \
              --command "$COMMENT_BODY" \
              --publish \
              --issue-body "$ISSUE_BODY" \
              --submission-id "$SUBMISSION_ID" \
              --submitter "$SUBMITTER"
          fi
          rc=$?
          set -e
          case "$rc" in 2|3|4) exit 0 ;; esac
          exit "$rc"

      # Saved explicitly, and even when the job failed — a failed panel is
      # exactly the run whose checkpoints are worth keeping. The cache
      # action's built-in post-step skips saving on failure, hence the
      # separate save. Caches are immutable, so each attempt saves under a
      # fresh run-id key and the restore above picks the newest by prefix.
      # The hashFiles guard skips the save when no agent checkpointed
      # (a bad command, an unreadable PDF) rather than warning about an
      # empty path.
      - name: Save panel checkpoints
        if: always() && hashFiles('runs/.checkpoints/**') != ''
        uses: actions/cache/save@v4
        with:
          path: runs/.checkpoints
          key: pra-checkpoints-${{ github.event.issue.number || github.event.inputs.submission_id || 'manual' }}-${{ github.run_id }}

      - name: Report a command nobody could act on
        if: steps.run.outputs.bad_command == 'true' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.run.outputs.bad_command_reason }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "$REASON

          No review was run."

      - name: Report a draft that has already been reviewed
        if: steps.run.outputs.already_reviewed == 'true' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.run.outputs.already_reviewed_reason }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "**No review was run.** $REASON"

      - name: Report an unreadable submission
        if: steps.run.outputs.unreadable == 'true' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.run.outputs.unreadable_reason }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "**No review was run.** No manuscript text source passed validation,
          so nothing was sent to a referee and nothing is published. This is
          not an assessment of the work.

          > $REASON

          The archive full text, PDF conversion, and OCR fallback all failed
          validation against the archive title and abstract. If you are an
          author, posting a text-based revision will usually fix it. Say so
          here and an editor will re-run the panel."

      - name: Open the review pull request
        id: pr
        if: >-
          steps.run.outputs.unreadable != 'true'
          && steps.run.outputs.bad_command != 'true'
          && steps.run.outputs.already_reviewed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.run.outputs.decision }}
          DESK_REJECTED: ${{ steps.run.outputs.desk_rejected }}
          ROUND: ${{ steps.run.outputs.round }}
          SLUG: ${{ steps.run.outputs.slug }}
          TITLE: ${{ steps.run.outputs.title }}
          BUNDLE: ${{ steps.run.outputs.path }}
          COST: ${{ steps.run.outputs.cost }}
          SUBMISSION_ID: ${{ github.event.issue.number || github.event.inputs.submission_id }}
        run: |
          branch="review/${SLUG}-$(date +%s)"
          git config user.name  "insilico-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/reviews
          git commit -m "review: ${TITLE} (${DECISION})"
          git push origin "$branch"

          if [ "${DESK_REJECTED}" = "true" ]; then
            headline="Desk rejected"
            verb="Desk screen output"
          else
            headline="Panel recommendation"
            verb="Referee panel output"
          fi

          {
            echo "${verb} for **${TITLE}**."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| ${headline} | \`${DECISION}\` |"
            echo "| Bundle | \`${BUNDLE}\` |"
            echo "| Cost | \$${COST} |"
            [ "${ROUND:-1}" != "1" ] && echo "| Round | ${ROUND} |"
            [ -n "${SUBMISSION_ID}" ] && echo "| Submission | #${SUBMISSION_ID} |"
            echo
            if [ "${DESK_REJECTED}" = "true" ]; then
              echo "> [!CAUTION]"
              echo "> **Opened as a draft — read the bundle before merging.**"
              echo ">"
              echo "> This submission was stopped at the desk; no referee panel ran."
              echo "> Merging publishes a rejection of a named author's work that one"
              echo "> triage pass produced and nothing checked. Read"
              echo "> \`desk_screen.md\` yourself first. If it is wrong, close this"
              echo "> PR. If you are unsure, close it and contact the authors"
              echo "> privately rather than publishing."
            else
              echo "The recommendation above is **advisory**. Merging this PR publishes"
              echo "the review and lists the preprint; closing it declines the submission."
            fi
            echo
            [ -n "${SUBMISSION_ID}" ] && echo "Refs #${SUBMISSION_ID}"
          } > /tmp/pr-body.md

          # A desk reject opens as a draft: the publication gate is already a
          # human merge, but a draft makes "do not merge this without reading
          # it" the default state rather than a line of prose in the body.
          extra=""
          title="Review: ${TITLE} (${DECISION})"
          if [ "${DESK_REJECTED}" = "true" ]; then
            extra="--draft"
            title="Desk reject: ${TITLE}"
          fi

          url="$(gh pr create $extra \
            --title "$title" \
            --body-file /tmp/pr-body.md \
            --label review \
            --label "verdict:${DECISION}" 2>/dev/null || \
            gh pr create $extra --title "$title" --body-file /tmp/pr-body.md)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report back on the submission
        if: >-
          github.event_name == 'issue_comment'
          && steps.run.outputs.unreadable != 'true'
          && steps.run.outputs.bad_command != 'true'
          && steps.run.outputs.already_reviewed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.run.outputs.decision }}
          DESK_REJECTED: ${{ steps.run.outputs.desk_rejected }}
          PR_URL: ${{ steps.pr.outputs.url }}
          BUNDLE: ${{ steps.run.outputs.path }}
        run: |
          # On a desk reject this comment stays deliberately spare. The issue
          # is public and the submitter is named on it, so quoting the desk's
          # reasoning here would publish an unreviewed rejection before any
          # human has confirmed it. Say that it was held and who decides next;
          # nothing more.
          if [ "${DESK_REJECTED}" = "true" ]; then
            {
              echo "This submission was **stopped at the desk** and has not been sent"
              echo "to the referee panel."
              echo
              echo "An editor will review the desk's finding before any decision is"
              echo "published. Nothing has been published yet, and the finding is not"
              echo "final until a person has checked it."
            } | gh issue comment "${{ github.event.issue.number }}" --body-file -
            exit 0
          fi

          {
            echo "The referee panel has finished."
            echo
            echo "**Recommendation: \`${DECISION}\`** — advisory only; a human editor decides."
            echo
            echo "Full bundle: ${PR_URL}"
            echo
            echo "<details><summary>Summary report</summary>"
            echo
            head -c 8000 "${BUNDLE}/summary.md" || true
            echo
            echo "</details>"
          } | gh issue comment "${{ github.event.issue.number }}" --body-file -

      - name: Report failure
        if: failure() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "The referee panel failed. See the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          The log names the failed reviewer, auditor, provider request, or
          pipeline stage. Incomplete panels are stopped before an editor
          decision is produced and are safe to re-run."
