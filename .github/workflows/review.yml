name: Run referee panel

# Triggered by an editor commenting `/review` on a submission issue, or manually
# with a URL. Deliberately *not* automatic: each run costs real money, and a
# `pull_request` trigger from a fork could not see the API key anyway.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      url:
        description: Preprint URL (arXiv / bioRxiv / medRxiv / direct PDF)
        required: true
      submission_id:
        description: Submission issue number (optional)
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: review-${{ github.event.issue.number || github.event.inputs.url }}
  cancel-in-progress: false

env:
  # Model selection lives in ./peerreview.toml, including the per-role split.
  # Setting REVIEW_MODEL here would override that file and collapse every
  # stage back onto one model, so it is deliberately unset.
  PIPELINE_REPO: https://github.com/pgarrett-scripps/PeerReviewAgents.git

jobs:
  review:
    # Editors only. author_association is computed by GitHub from repo
    # permissions, so this cannot be spoofed by the comment body.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
       startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Acknowledge the command
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PeerReviewAgents is private while the paper is unpublished, so the
      # runner needs a read token to clone it. Rewriting the URL in git config
      # keeps the token off the command line, where it would otherwise appear
      # in the step's own log. Once that repo is public, delete the
      # PRA_READ_TOKEN secret and this step turns itself into a no-op.
      - name: Authenticate to the pipeline repo
        env:
          PIPELINE_TOKEN: ${{ secrets.PRA_READ_TOKEN }}
        run: |
          if [ -n "$PIPELINE_TOKEN" ]; then
            # Send the credential as a Basic auth header rather than embedding
            # it in the URL. This is what actions/checkout does, and it is the
            # form fine-grained PATs actually authenticate with over git —
            # `x-access-token:<pat>` in the URL authenticates fine against the
            # REST API but is rejected by git, which then reports the repo as
            # not found and sends you looking at permissions instead.
            basic="$(printf 'x-access-token:%s' "$PIPELINE_TOKEN" | base64 -w0)"
            git config --global \
              "http.https://github.com/.extraheader" "AUTHORIZATION: basic $basic"
            echo "Using PRA_READ_TOKEN to reach the private pipeline repo."

            # Probe the API before git gets involved. git reports "Repository
            # not found" for anything it can't read, which conflates a bad
            # token with a token that simply lacks access; the API separates
            # them. Prints only a status code, never the token.
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $PIPELINE_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/pgarrett-scripps/PeerReviewAgents)"
            case "$code" in
              200) echo "Token check: OK (can read the pipeline repo)." ;;
              401) echo "::error::Token check: 401 — PRA_READ_TOKEN is not a valid" \
                        "credential. Usually a paste problem: a truncated value, or a" \
                        "trailing newline from piping it in. Re-set it with" \
                        "'gh secret set PRA_READ_TOKEN' and paste at the prompt." ;;
              404) echo "::error::Token check: 404 — the token is valid but cannot see" \
                        "pgarrett-scripps/PeerReviewAgents. Check Repository access lists" \
                        "that repo and Repository permissions grant Contents: Read." ;;
              *)   echo "::warning::Token check returned HTTP $code." ;;
            esac
          else
            echo "No PRA_READ_TOKEN set — assuming the pipeline repo is public."
          fi

      - name: Pin the referee panel
        id: pipeline
        run: |
          # `set -e` doesn't fire on a failure inside a command substitution,
          # so an unreachable repo used to yield an empty sha and surface as
          # pip complaining about an "empty revision" — pointing at the URL
          # rather than at the auth problem that actually caused it.
          if ! sha="$(git ls-remote "$PIPELINE_REPO" HEAD | cut -f1)" || [ -z "$sha" ]; then
            echo "::error::Could not read $PIPELINE_REPO."
            echo "::error::While that repo is private this needs a PRA_READ_TOKEN secret" \
                 "whose fine-grained token grants Contents: Read on it." \
                 "GitHub reports 'Repository not found' for a private repo a token" \
                 "cannot see, so a missing permission looks identical to a typo."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinning PeerReviewAgents @ $sha"
          pip install --quiet "peerreviewagents @ git+${PIPELINE_REPO}@${sha}"
          pip install --quiet pyyaml

      - name: Run the panel
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEERREVIEW_PIPELINE_SHA: ${{ steps.pipeline.outputs.sha }}
          # Untrusted input reaches the script through the environment, never
          # through shell interpolation.
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_URL: ${{ github.event.inputs.url }}
          SUBMISSION_ID: ${{ github.event.issue.number || github.event.inputs.submission_id }}
          SUBMITTER: ${{ github.event.issue.user.login }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            python scripts/run_review.py \
              --url "$INPUT_URL" \
              --submission-id "${SUBMISSION_ID:-}" \
              --submitter "${SUBMITTER:-}"
          else
            python scripts/run_review.py \
              --issue-body "$ISSUE_BODY" \
              --submission-id "$SUBMISSION_ID" \
              --submitter "$SUBMITTER"
          fi

      - name: Rebuild the index
        run: python scripts/build_index.py

      - name: Open the review pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.run.outputs.decision }}
          SLUG: ${{ steps.run.outputs.slug }}
          TITLE: ${{ steps.run.outputs.title }}
          BUNDLE: ${{ steps.run.outputs.path }}
          COST: ${{ steps.run.outputs.cost }}
          SUBMISSION_ID: ${{ github.event.issue.number || github.event.inputs.submission_id }}
        run: |
          branch="review/${SLUG}-$(date +%s)"
          git config user.name  "insilico-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/reviews
          git commit -m "review: ${TITLE} (${DECISION})"
          git push origin "$branch"

          {
            echo "Referee panel output for **${TITLE}**."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Panel recommendation | \`${DECISION}\` |"
            echo "| Bundle | \`${BUNDLE}\` |"
            echo "| Cost | \$${COST} |"
            [ -n "${SUBMISSION_ID}" ] && echo "| Submission | #${SUBMISSION_ID} |"
            echo
            echo "The recommendation above is **advisory**. Merging this PR publishes"
            echo "the review and lists the preprint; closing it declines the submission."
            echo
            [ -n "${SUBMISSION_ID}" ] && echo "Refs #${SUBMISSION_ID}"
          } > /tmp/pr-body.md

          url="$(gh pr create \
            --title "Review: ${TITLE} (${DECISION})" \
            --body-file /tmp/pr-body.md \
            --label review \
            --label "verdict:${DECISION}" 2>/dev/null || \
            gh pr create --title "Review: ${TITLE} (${DECISION})" --body-file /tmp/pr-body.md)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report back on the submission
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.run.outputs.decision }}
          PR_URL: ${{ steps.pr.outputs.url }}
          BUNDLE: ${{ steps.run.outputs.path }}
        run: |
          {
            echo "The referee panel has finished."
            echo
            echo "**Recommendation: \`${DECISION}\`** — advisory only; a human editor decides."
            echo
            echo "Full bundle: ${PR_URL}"
            echo
            echo "<details><summary>Summary report</summary>"
            echo
            head -c 8000 "${BUNDLE}/summary.md" || true
            echo
            echo "</details>"
          } | gh issue comment "${{ github.event.issue.number }}" --body-file -

      - name: Report failure
        if: failure() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "The referee panel failed. See the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Common causes: the URL isn't a supported preprint source, the PDF is scanned or image-only, or the source is paywalled."
