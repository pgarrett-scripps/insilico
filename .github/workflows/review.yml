name: Run referee panel

# Triggered by an editor commenting `/review` on a submission issue, or manually
# with a URL. Deliberately *not* automatic: each run costs real money, and a
# `pull_request` trigger from a fork could not see the API key anyway.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      url:
        description: Preprint URL (arXiv / bioRxiv / medRxiv)
        required: true
      submission_id:
        description: Submission issue number (optional)
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: review-${{ github.event.issue.number || github.event.inputs.url }}
  cancel-in-progress: false

env:
  # Model selection lives in ./peerreview.toml, including the per-role split.
  # Setting REVIEW_MODEL here would override that file and collapse every
  # stage back onto one model, so it is deliberately unset.
  PIPELINE_REPO: https://github.com/pgarrett-scripps/PeerReviewAgents.git
  # Which ref to pin from. Normally `main`. Kept as a knob rather than
  # hard-coded HEAD so the journal can be pointed at a branch to exercise
  # pipeline work before it lands, without editing the resolution logic. The
  # run records the SHA it resolved to either way, so a review always names
  # exact code regardless of which ref produced it.
  PIPELINE_REF: main
  # PDF -> markdown converter, from PyPI. A per-platform wheel, so this needs
  # no Rust toolchain on the runner. Pinned rather than floating: the panel
  # reads whatever this produces, and a converter that changed how it reads a
  # two-column page between two rounds of the same paper would show up as the
  # authors having rewritten it. Kept as a knob so a fix can be pulled from a
  # branch without editing the install step.
  RUSTYPAPER_SPEC: "rustypaper==0.2.0"
  # The text as written. Compression was measured and reverted: under `light`
  # the clarity reviewer reported "grammatical errors that obscure the main
  # claims" three times on a paper where the uncompressed run reported none —
  # it read the dropped articles and copulas as the authors' writing. The
  # manuscript is a cached prefix on the cheapest model tier, so compressing
  # it saves under a cent a review, which does not buy a published criticism
  # of real people for something we did to their text.
  PEERREVIEW_CAVEMAN: "off"

jobs:
  review:
    # Editors only. author_association is computed by GitHub from repo
    # permissions, so this cannot be spoofed by the comment body.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
       (startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/revise')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Acknowledge the command
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PeerReviewAgents is private while the paper is unpublished, so the
      # runner needs a read token to clone it. Rewriting the URL in git config
      # keeps the token off the command line, where it would otherwise appear
      # in the step's own log. Once that repo is public, delete the
      # PRA_READ_TOKEN secret and this step turns itself into a no-op.
      - name: Authenticate to the pipeline repo
        env:
          PIPELINE_TOKEN: ${{ secrets.PRA_READ_TOKEN }}
        run: |
          if [ -n "$PIPELINE_TOKEN" ]; then
            # Send the credential as a Basic auth header rather than embedding
            # it in the URL. This is what actions/checkout does, and it is the
            # form fine-grained PATs actually authenticate with over git —
            # `x-access-token:<pat>` in the URL authenticates fine against the
            # REST API but is rejected by git, which then reports the repo as
            # not found and sends you looking at permissions instead.
            # actions/checkout writes its own extraheader (with GITHUB_TOKEN)
            # into the *local* repo config, and local config beats global — so
            # a global credential set here is silently ignored for any git
            # command run from the workspace. Export the header instead and
            # apply it per-command with `git -c`, which outranks both.
            basic="$(printf 'x-access-token:%s' "$PIPELINE_TOKEN" | base64 -w0)"
            echo "PIPELINE_AUTH=AUTHORIZATION: basic $basic" >> "$GITHUB_ENV"
            echo "Using PRA_READ_TOKEN to reach the private pipeline repo."

            # Probe the API before git gets involved. git reports "Repository
            # not found" for anything it can't read, which conflates a bad
            # token with a token that simply lacks access; the API separates
            # them. Prints only a status code, never the token.
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $PIPELINE_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/pgarrett-scripps/PeerReviewAgents)"
            case "$code" in
              200) echo "Token check: OK (can read the pipeline repo)." ;;
              401) echo "::error::Token check: 401 — PRA_READ_TOKEN is not a valid" \
                        "credential. Usually a paste problem: a truncated value, or a" \
                        "trailing newline from piping it in. Re-set it with" \
                        "'gh secret set PRA_READ_TOKEN' and paste at the prompt." ;;
              404) echo "::error::Token check: 404 — the token is valid but cannot see" \
                        "pgarrett-scripps/PeerReviewAgents. Check Repository access lists" \
                        "that repo and Repository permissions grant Contents: Read." ;;
              *)   echo "::warning::Token check returned HTTP $code." ;;
            esac
          else
            echo "No PRA_READ_TOKEN set — assuming the pipeline repo is public."
          fi

      - name: Pin the referee panel
        id: pipeline
        run: |
          # `set -e` doesn't fire on a failure inside a command substitution,
          # so an unreachable repo used to yield an empty sha and surface as
          # pip complaining about an "empty revision" — pointing at the URL
          # rather than at the auth problem that actually caused it.
          # http.extraheader is multi-valued, so adding ours alongside the one
          # actions/checkout persisted sends two Authorization headers and the
          # server rejects the request. Git documents an empty value as the
          # reset for such a list, so clear it first, then add ours.
          if ! sha="$(git -c "http.https://github.com/.extraheader=" \
                          -c "http.https://github.com/.extraheader=${PIPELINE_AUTH}" \
                        ls-remote "$PIPELINE_REPO" "$PIPELINE_REF" | cut -f1)" \
             || [ -z "$sha" ]; then
            echo "::error::Could not read $PIPELINE_REPO."
            echo "::error::While that repo is private this needs a PRA_READ_TOKEN secret" \
                 "whose fine-grained token grants Contents: Read on it." \
                 "GitHub reports 'Repository not found' for a private repo a token" \
                 "cannot see, so a missing permission looks identical to a typo."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinning PeerReviewAgents @ $sha"
          # Scope the credential to this one command via GIT_CONFIG_* rather
          # than setting it globally: a global extraheader would stack with the
          # local one actions/checkout persisted and break the later `git push`
          # with the same "Duplicate header" the ls-remote above had to dodge.
          # pip clones into a temp dir with no local config, so one header.
          # [research] pulls the arXiv client. Without it the Novelty and
          # Literature reviewers' arXiv vendor degrades to a one-line "arxiv
          # unavailable" note and the router silently falls through to the
          # other sources — so the panel would still produce confident claims
          # about prior work, just without having searched the index that
          # matters most for the computational half of the corpus. It fails
          # quietly by design, which is exactly why it has to be installed
          # explicitly rather than assumed.
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="${PIPELINE_AUTH:-}" \
            pip install --quiet "peerreviewagents[research] @ git+${PIPELINE_REPO}@${sha}"
          pip install --quiet pyyaml

          # The manuscript converter, and the only one: the pipeline reads
          # PDFs through rustypaper and has no fallback, because the fallback
          # fused ~2% of words together and flattened every heading and table
          # into prose. A panel given that reviews a document the authors did
          # not write, so a converter that will not install has to stop the
          # run rather than quietly downgrade it.
          #
          # peerreviewagents depends on rustypaper too, so this normally lands
          # with it; the explicit install is what pins the version and what
          # turns a resolution failure into a message naming the converter.
          pip install --quiet "$RUSTYPAPER_SPEC" || {
            echo "::error::rustypaper did not install, so there is no way to"\
                 "read the manuscript. Nothing is published from this run."
            exit 1
          }

          # Confirm the optional vendor actually landed, rather than
          # discovering months later that every review skipped arXiv.
          python -c "import arxiv" || {
            echo "::error::peerreviewagents[research] did not install the arxiv"\
                 "client. Literature and Novelty searches would silently skip"\
                 "arXiv, so this run is stopping instead of publishing a review"\
                 "that claims to have searched it."
            exit 1
          }

      - name: Run the panel
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only used when an editor writes `/review openrouter <model>`.
          # Absent, that command fails with an authentication error rather
          # than silently falling back to a paid Anthropic run.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEERREVIEW_PIPELINE_SHA: ${{ steps.pipeline.outputs.sha }}
          # Untrusted input reaches the script through the environment, never
          # through shell interpolation.
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          INPUT_URL: ${{ github.event.inputs.url }}
          SUBMISSION_ID: ${{ github.event.issue.number || github.event.inputs.submission_id }}
          SUBMITTER: ${{ github.event.issue.user.login }}
        run: |
          # One verb. Whether this is a first look or a new round is read off
          # which draft the archive serves — a draft we have not reviewed is a
          # new round — rather than declared by the editor. `/revise` still
          # works and does exactly what `/review` does.
          #
          # --publish is passed here and nowhere else. This is the editorial
          # route: an editor typed a command on a submission issue, so the
          # result belongs in docs/reviews/. A local run testing a prompt
          # change is a question about the pipeline and lands in runs/.
          #
          # Neither form accepts author text. The panel judges the manuscript
          # in front of it; an author's account of what they changed is not
          # evidence, and when it was accepted the compliance auditor
          # confirmed claims the manuscript did not support.
          #
          # The comment is passed through, never interpreted here. `replace`
          # and the provider options are parsed in Python (see parse_command),
          # which is the one place this untrusted text is read and which
          # refuses anything that is not a known constant or a validated model
          # slug. Bash only ever handles it as an environment variable.
          #
          # Exit 3 is not a failure. It means the PDF converted too badly to
          # review — a scanned or image-only file, almost always — and the
          # panel was never started. That is a fact about the file, so it gets
          # a plain note on the issue rather than a red run and a stack trace.
          # Exit 2 is a command nobody could act on; exit 4 is a draft already
          # reviewed. Same treatment: say so, do not fail the run.
          set +e
          if [ -n "$INPUT_URL" ]; then
            python scripts/run_review.py \
              --command "$COMMENT_BODY" \
              --publish \
              --url "$INPUT_URL" \
              --submission-id "${SUBMISSION_ID:-}" \
              --submitter "${SUBMITTER:-}"
          else
            python scripts/run_review.py \
              --command "$COMMENT_BODY" \
              --publish \
              --issue-body "$ISSUE_BODY" \
              --submission-id "$SUBMISSION_ID" \
              --submitter "$SUBMITTER"
          fi
          rc=$?
          set -e
          case "$rc" in 2|3|4) exit 0 ;; esac
          exit "$rc"

      - name: Report a command nobody could act on
        if: steps.run.outputs.bad_command == 'true' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.run.outputs.bad_command_reason }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "$REASON

          No review was run."

      - name: Report a draft that has already been reviewed
        if: steps.run.outputs.already_reviewed == 'true' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.run.outputs.already_reviewed_reason }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "**No review was run.** $REASON"

      - name: Report an unreadable submission
        if: steps.run.outputs.unreadable == 'true' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.run.outputs.unreadable_reason }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "**No review was run.** This preprint's PDF could not be converted
          into text the panel could read, so nothing was sent to a referee and
          nothing is published. This is not an assessment of the work.

          > $REASON

          The usual cause is a scanned or image-only PDF: the pages are
          pictures of text, and we have no OCR. If you are an author, posting a
          version exported from your writing software rather than scanned will
          fix it. Say so here and an editor will re-run the panel."

      - name: Open the review pull request
        id: pr
        if: >-
          steps.run.outputs.unreadable != 'true'
          && steps.run.outputs.bad_command != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.run.outputs.decision }}
          DESK_REJECTED: ${{ steps.run.outputs.desk_rejected }}
          ROUND: ${{ steps.run.outputs.round }}
          SLUG: ${{ steps.run.outputs.slug }}
          TITLE: ${{ steps.run.outputs.title }}
          BUNDLE: ${{ steps.run.outputs.path }}
          COST: ${{ steps.run.outputs.cost }}
          SUBMISSION_ID: ${{ github.event.issue.number || github.event.inputs.submission_id }}
        run: |
          branch="review/${SLUG}-$(date +%s)"
          git config user.name  "insilico-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/reviews
          git commit -m "review: ${TITLE} (${DECISION})"
          git push origin "$branch"

          if [ "${DESK_REJECTED}" = "true" ]; then
            headline="Desk rejected"
            verb="Desk screen output"
          else
            headline="Panel recommendation"
            verb="Referee panel output"
          fi

          {
            echo "${verb} for **${TITLE}**."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| ${headline} | \`${DECISION}\` |"
            echo "| Bundle | \`${BUNDLE}\` |"
            echo "| Cost | \$${COST} |"
            [ "${ROUND:-1}" != "1" ] && echo "| Round | ${ROUND} |"
            [ -n "${SUBMISSION_ID}" ] && echo "| Submission | #${SUBMISSION_ID} |"
            echo
            if [ "${DESK_REJECTED}" = "true" ]; then
              echo "> [!CAUTION]"
              echo "> **Opened as a draft — read the bundle before merging.**"
              echo ">"
              echo "> This submission was stopped at the desk; no referee panel ran."
              echo "> Merging publishes a rejection of a named author's work that one"
              echo "> triage pass produced and nothing checked. Read"
              echo "> \`desk_screen.md\` yourself first. If it is wrong, close this"
              echo "> PR. If you are unsure, close it and contact the authors"
              echo "> privately rather than publishing."
            else
              echo "The recommendation above is **advisory**. Merging this PR publishes"
              echo "the review and lists the preprint; closing it declines the submission."
            fi
            echo
            [ -n "${SUBMISSION_ID}" ] && echo "Refs #${SUBMISSION_ID}"
          } > /tmp/pr-body.md

          # A desk reject opens as a draft: the publication gate is already a
          # human merge, but a draft makes "do not merge this without reading
          # it" the default state rather than a line of prose in the body.
          extra=""
          title="Review: ${TITLE} (${DECISION})"
          if [ "${DESK_REJECTED}" = "true" ]; then
            extra="--draft"
            title="Desk reject: ${TITLE}"
          fi

          url="$(gh pr create $extra \
            --title "$title" \
            --body-file /tmp/pr-body.md \
            --label review \
            --label "verdict:${DECISION}" 2>/dev/null || \
            gh pr create $extra --title "$title" --body-file /tmp/pr-body.md)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report back on the submission
        if: >-
          github.event_name == 'issue_comment'
          && steps.run.outputs.unreadable != 'true'
          && steps.run.outputs.bad_command != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.run.outputs.decision }}
          DESK_REJECTED: ${{ steps.run.outputs.desk_rejected }}
          PR_URL: ${{ steps.pr.outputs.url }}
          BUNDLE: ${{ steps.run.outputs.path }}
        run: |
          # On a desk reject this comment stays deliberately spare. The issue
          # is public and the submitter is named on it, so quoting the desk's
          # reasoning here would publish an unreviewed rejection before any
          # human has confirmed it. Say that it was held and who decides next;
          # nothing more.
          if [ "${DESK_REJECTED}" = "true" ]; then
            {
              echo "This submission was **stopped at the desk** and has not been sent"
              echo "to the referee panel."
              echo
              echo "An editor will review the desk's finding before any decision is"
              echo "published. Nothing has been published yet, and the finding is not"
              echo "final until a person has checked it."
            } | gh issue comment "${{ github.event.issue.number }}" --body-file -
            exit 0
          fi

          {
            echo "The referee panel has finished."
            echo
            echo "**Recommendation: \`${DECISION}\`** — advisory only; a human editor decides."
            echo
            echo "Full bundle: ${PR_URL}"
            echo
            echo "<details><summary>Summary report</summary>"
            echo
            head -c 8000 "${BUNDLE}/summary.md" || true
            echo
            echo "</details>"
          } | gh issue comment "${{ github.event.issue.number }}" --body-file -

      - name: Report failure
        if: failure() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "The referee panel failed. See the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Common causes: the URL isn't a supported preprint source, the PDF is scanned or image-only, or the source is paywalled."
