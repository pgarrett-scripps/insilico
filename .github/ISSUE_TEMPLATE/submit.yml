name: Submit a preprint
description: Ask the referee panel to review a public preprint.
title: "[Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        One preprint per issue. Paste the link; we fetch the PDF and pull the
        title, authors and version ourselves.

        An editor starts each run by hand, so expect a wait. Reviews are
        published whatever the verdict, and the panel only advises.
        [Read the policy](https://pgarrett-scripps.github.io/insilico/policy/)

  - type: input
    id: url
    attributes:
      label: Preprint link
      description: arXiv, bioRxiv or medRxiv. Not a direct PDF link.
      placeholder: https://arxiv.org/abs/2401.12345
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: What is the paper about?
      description: Two or three sentences, so an editor can check it is in scope.
    validations:
      required: true

  - type: dropdown
    id: relationship
    attributes:
      label: Are you an author of this paper?
      description: Shown on the published review. Anyone may submit any public preprint.
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: textarea
    id: focus
    attributes:
      label: Anything else the editor should know?
      description: |
        Optional, and read by a person. Nothing here reaches a referee.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you submit
      options:
        - label: The preprint is public and its PDF is real text, not a scan.
          required: true
        - label: I understand the review is machine-generated and gets published either way.
          required: true
