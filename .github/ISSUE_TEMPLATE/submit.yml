name: Submit a preprint
description: Ask the referee panel to review a public preprint.
title: "[Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        One preprint per issue. Paste the link. We fetch the PDF and pull the
        title, authors, and version ourselves.

        An editor starts each run by hand, so expect a wait. **The review is
        published whatever it says**, and we will not take one down because you
        dislike the recommendation.
        [Read the policy](https://pgarrett-scripps.github.io/insilico/policy/)

  - type: input
    id: url
    attributes:
      label: Preprint link
      description: arXiv, bioRxiv or medRxiv. Not a direct PDF link.
      placeholder: https://arxiv.org/abs/2401.12345
    validations:
      required: true

  # Keep the words "are you an author" in the label: extract_authorship finds
  # this answer by matching that string against the rendered issue body, and a
  # reword makes the published review silently say the relationship is
  # unrecorded instead.
  - type: dropdown
    id: relationship
    attributes:
      label: Are you an author of, or affiliated with, this paper?
      description: Shown on the published review. Anyone may submit any public preprint.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
