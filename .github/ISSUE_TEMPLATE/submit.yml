name: Submit a preprint
description: Ask the referee panel to review a public preprint.
title: "[Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        One preprint per issue. We fetch the PDF ourselves — you only need the link.

        Reviews are triggered manually by an editor, so expect a wait. Read the
        [policy](https://github.com/pgarrett-scripps/insilico/blob/main/docs/policy.md)
        first: recommendations are advisory, and reviews are published whatever
        the verdict.

  - type: input
    id: url
    attributes:
      label: Preprint URL
      description: |
        arXiv, bioRxiv or medRxiv only. Direct PDF links aren't accepted — a
        review has to name a specific revision, and only a preprint server
        gives us a DOI and a version number to name it with.
      placeholder: https://arxiv.org/abs/2401.12345
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: What is the paper about?
      description: |
        Two or three sentences. Enough for an editor to judge whether it's in
        scope — any field, as long as the claims can be evaluated from the
        manuscript and the materials it cites or deposits. See the review
        criteria: https://pgarrett-scripps.github.io/insilico/criteria/
    validations:
      required: true

  - type: textarea
    id: focus
    attributes:
      label: Anything the editor should know before running it?
      description: |
        Optional, and read by a person rather than by the panel — nothing
        written here reaches a referee, and the panel is given the manuscript
        and nothing else. Use it for what an editor needs to decide whether to
        run the panel at all: a paper that quotes prompt-injection payloads as
        its subject matter, say, or a preprint posted so recently the server
        may not serve a PDF yet.
    validations:
      required: false

  - type: dropdown
    id: relationship
    attributes:
      label: Are you an author of this paper?
      description: |
        Recorded on the published review. Anyone may submit any public
        preprint, but a review the authors did not ask for is a different
        thing from one they did, and a reader deserves to see which this is.
      options:
        - "Yes — I am an author"
        - "No — I am not an author"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: If you're not an author, why are you submitting it?
      description: |
        Leave blank if you are an author. An editor reads this before running
        anything — submitting someone else's work to attach a public criticism
        to it is not a use we support.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you submit
      options:
        - label: The preprint is publicly accessible and the PDF is text (not scanned).
          required: true
        - label: I understand the review is machine-generated, advisory, and published regardless of the verdict.
          required: true
